<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Your Cart</h1>
    </header>
    <div class="container mt-4">
        <div id="cart-items" class="row">
            <!-- Cart items will be injected here by JavaScript -->
        </div>
    </div>
    <script >
        document.addEventListener('DOMContentLoaded', () => {
    const cartItemsContainer = document.getElementById('cart-items');

    // Retrieve cart items from local storage
    const cart = JSON.parse(localStorage.getItem('cart')) || [];

    if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
        return;
    }

    // Generate HTML for each product in the cart
    const itemsHtml = cart.map(item => `
        <div class="card border-0 shadow-none">
            <img class="card-img-top" src="${item.imgSrc}" alt="Card image cap">
            <div class="card-body">
                <h6 class="card-title">${item.price}</h6>
                <p class="card-text">${item.description}</p>
                <button class="btn btn-danger remove-from-cart" data-id="${item.id}">Remove from cart</button>
            </div>
        </div>
    `).join('');

    cartItemsContainer.innerHTML = itemsHtml;

    // Add event listeners for removing items
    const removeButtons = document.querySelectorAll('.remove-from-cart');
    removeButtons.forEach(button => {
        button.addEventListener('click', (event) => {
            const id = event.target.getAttribute('data-id');
            // Remove product from cart
            const updatedCart = cart.filter(item => item.id !== id);
            // Save the updated cart back to local storage
            localStorage.setItem('cart', JSON.stringify(updatedCart));
            // Reload the cart page to reflect changes
            window.location.reload();
        });
    });
});

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
