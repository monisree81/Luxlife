  <title>Three Containers with Hover Effect</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      display: flex;
      flex-direction: column;
      background-color: #f0f0f0;
      /* Remove overflow: hidden to allow scrolling */
    }

    .container {
      position: relative;
      width: 100vw;
      height: 700px;
    }

    .image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }

    .options {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      background-color: rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .container:hover .image {
      opacity: 50%;
    }

    .container:hover .options {
      opacity: 1;
      visibility: visible;
    }

    .circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 20px;
      position: relative;
      overflow: hidden;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .circle:hover {
      transform: scale(1.1);
    }

    .label {
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .circle:hover .label {
      opacity: 1;
    }
  </style>
</head>
